<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微光記帳</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="微光記帳">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <!-- 歡迎畫面 (Landing) -->
        <section id="landing-section" class="section landing-container">
            <div class="landing-card">
                <div class="app-logo">💰</div>
                <h1>微光<br>長輩開銷記帳助手</h1>
                <p class="subtitle">每一筆溫馨開銷，<br>都是陪伴媽媽的練習題。</p>
                <button id="go-login-btn" class="btn btn-primary btn-lg">開啟小金庫</button>
            </div>
        </section>

        <!-- 登入畫面 -->
        <section id="login-section" class="section hidden">
            <div class="login-card">
                <button id="back-to-landing" class="btn-icon back-btn">←</button>
                <div class="app-logo small">💰</div>
                <h2>金庫登入</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">使用者名稱</label>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="請輸入帳號">
                    </div>
                    <div class="form-group">
                        <label for="password">通關密碼</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="請輸入密碼">
                    </div>
                    <button type="submit" class="btn btn-primary">解鎖金庫</button>
                    <p id="login-error" class="error-msg"></p>
                </form>
            </div>
        </section>

        <!-- 主畫面 (Dashboard) -->
        <section id="main-section" class="section hidden">
            <header class="header">
                <div class="brand">
                    <span class="app-logo small">💰</span>
                    <span id="welcome-msg">歡迎回來！</span>
                </div>
                <button id="logout-btn" class="btn btn-sm btn-secondary">登出</button>
            </header>

            <!-- 分頁標籤 -->
            <div class="tab-navigation">
                <button id="tab-accounting" class="tab-btn active" data-tab="accounting">💳 記帳</button>
                <button id="tab-health" class="tab-btn" data-tab="health">❤️ 健康監測</button>
            </div>

            <!-- 記帳分頁 -->
            <div id="tab-accounting-content" class="tab-content active">
                <!-- 帳戶統計 -->
                <div class="bells-card">
                <div class="budget-main-display" id="budget-section">
                    <span class="label-lg">本月還能花</span>
                    <div class="amount-hero" id="budget-remaining">$0</div>

                    <div class="progress-bar-bg">
                        <div id="budget-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="budget-meta">
                        <span>總預算: <span id="total-budget">$0</span></span>
                        <span id="budget-percent">0%</span>
                    </div>
                </div>

                <div class="bell-stats">
                    <div class="stat-item income">
                        <span class="label">本月收入</span>
                        <span id="total-income" class="amount">0</span>
                    </div>
                    <div class="stat-item expense">
                        <span class="label">本月支出</span>
                        <span id="total-expense" class="amount">0</span>
                    </div>
                </div>
            </div>

            <!-- 功能按鈕區 -->
            <div class="action-grid">
                <button id="btn-add-transaction" class="action-card income">
                    <span class="icon">✏️</span>
                    <span>記一筆</span>
                </button>
                <button id="btn-manage-category" class="action-card expense">
                    <span class="icon">🗂️</span>
                    <span>管理分類</span>
                </button>
            </div>

            <!-- 交易紀錄 -->
            <div class="list-container">
                <div class="month-nav">
                    <button id="prev-month-btn" class="btn-month-nav">‹</button>
                    <h3 id="transaction-list-title">11月收支</h3>
                    <button id="next-month-btn" class="btn-month-nav">›</button>
                </div>
                <div id="transaction-list" class="transaction-list">
                    <!-- 動態載入 -->
                </div>
            </div>
            </div>

            <!-- 健康監測分頁 -->
            <div id="tab-health-content" class="tab-content">
                <div class="health-container">
                    <!-- 血糖記錄卡片 -->
                    <div class="health-card blood-sugar-card">
                        <div class="health-card-header">
                            <span class="health-icon">🩸</span>
                            <h3>血糖記錄</h3>
                        </div>
                        <form id="blood-sugar-form" class="health-form">
                            <div class="form-group">
                                <label>記錄時間</label>
                                <input type="datetime-local" id="blood-sugar-time" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label>血糖值 (mg/dL)</label>
                                <input type="number" id="blood-sugar-value" class="form-input" placeholder="例：120" min="0" step="0.1" required>
                            </div>
                            <div class="form-group">
                                <label>測量位置</label>
                                <select id="blood-sugar-location" class="form-input">
                                    <option value="空腹">空腹</option>
                                    <option value="飯後2小時">飯後2小時</option>
                                    <option value="睡前">睡前</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>備註</label>
                                <input type="text" id="blood-sugar-note" class="form-input" placeholder="例：用藥後、早餐後">
                            </div>
                            <button type="submit" class="btn btn-health blood-sugar-btn">💾 保存血糖</button>
                        </form>
                    </div>

                    <!-- 血壓/心率記錄卡片 -->
                    <div class="health-card blood-pressure-card">
                        <div class="health-card-header">
                            <span class="health-icon">💪</span>
                            <h3>血壓/心率記錄</h3>
                        </div>
                        <form id="blood-pressure-form" class="health-form">
                            <div class="form-group">
                                <label>記錄時間</label>
                                <input type="datetime-local" id="blood-pressure-time" class="form-input" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>收縮壓 (高) mmHg</label>
                                    <input type="number" id="blood-pressure-sys" class="form-input" placeholder="例：120" min="0" required>
                                </div>
                                <div class="form-group">
                                    <label>舒張壓 (低) mmHg</label>
                                    <input type="number" id="blood-pressure-dia" class="form-input" placeholder="例：80" min="0" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>心率 (次/分)</label>
                                <input type="number" id="heart-rate" class="form-input" placeholder="例：72" min="0">
                            </div>
                            <div class="form-group">
                                <label>備註</label>
                                <input type="text" id="blood-pressure-note" class="form-input" placeholder="例：晨起測量、運動後">
                            </div>
                            <button type="submit" class="btn btn-health blood-pressure-btn">💾 保存血壓</button>
                        </form>
                    </div>

                    <!-- 健康記錄列表 -->
                    <div class="health-records-section">
                        <h3>📋 健康紀錄</h3>
                        <div class="record-search-box">
                            <input type="text" id="health-search-input" class="record-search-input" placeholder="搜尋備註內容...">
                        </div>
                        <div class="record-filters">
                            <button id="filter-all-health" class="filter-btn active">全部</button>
                            <button id="filter-blood-sugar" class="filter-btn">血糖</button>
                            <button id="filter-blood-pressure" class="filter-btn">血壓/心率</button>
                        </div>
                        <div id="health-records-list" class="health-records-list">
                            <p class="empty-message">暫無記錄</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- 隱藏的 Template 用於 SweetAlert -->
    <template id="tpl-transaction-form">
        <form id="swal-txn-form" class="swal-form">
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="swal-date" class="swal2-input" required>
            </div>
            <div class="form-group">
                <label>收支</label>
                <select id="swal-type" class="swal2-select">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <div class="form-group">
                <label>類別</label>
                <select id="swal-category" class="swal2-select">
                    <!-- JS 填入 -->
                </select>
            </div>
            <div class="form-group">
                <label>金額</label>
                <input type="number" id="swal-amount" class="swal2-input" placeholder="多少錢？" min="1" required>
            </div>
            <div class="form-group">
                <label>備註</label>
                <input type="text" id="swal-note" class="swal2-input" placeholder="例如：買卡片、聚餐">
            </div>
        </form>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
